<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <!-- link font awesome -->
    <link rel="stylesheet" href="/src/public/converter/font-Aowesome/all.css">
    <!-- link constant -->
    <link rel="stylesheet" href="/src/public/converter/constants.css">
    <!-- link of the style.css -->
    <link rel="stylesheet" href="/src/public/converter/style.css">

</head>


<body>


    <!-- container asidebar -->
    <div class="container-asidebar-site">

        <!-- header or top asidebar -->
        <div class="header-asidebar">

            <!-- title asidebar -->
            <div class="title-asidebar">
                <p>واحد ها</p>
            </div>
            <!-- choose money or measurment -->
            <div class="button-money-measurment">
                <button type="button">اندازه گیری</button>
                <button type="button">پول</button>
            </div>

        </div>

        <!-- separator line -->
        <div class="separator-line"></div>

        <!-- container suggestions -->
        <div class="container-suggestions">

            <!-- title suggestion -->
            <div class="title-suggestions">
                <p>پیشنهادات</p>
            </div>

            <!-- suggestions  -->
            <div class="suggestion-asidebar">
                <!-- suggestion-1 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(<i class="fas fa-dollar-sign"></i>)</p>
                            <p>دلار</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>یورو</p>
                            <p>(<i class="fas fa-euro-sign"></i>)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-2 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(<i class="fas fa-pound-sign"></i>)</p>
                            <p>پوند</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>لیر</p>
                            <p>(<i class="fas fa-turkish-lira"></i>)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-3 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(m)</p>
                            <p>متر</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>اینچ</p>
                            <p>(in)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-4 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(m)</p>
                            <p>متر</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>کیلومتر</p>
                            <p>(km)</p>
                        </div>

                    </button>
                </div>

            </div>
        </div>

        <!-- separator line -->
        <div class="separator-line"></div>

        <!-- container-settings -->
        <div class="container-prices">
            <!-- title-prices -->
            <div class="title-prices">
                <p>قیمت ها</p>
            </div>

            <div class="prices">
                <div class="prices-item-1"></div>
                <div class="prices-item-2"></div>
                <div class="prices-item-3"></div>
            </div>


        </div>

    </div>

    <!-- container-site -->
    <div class="container-converter-right">
        <!--  -->
        <div class="header-site">
            <h1>تبدیل کننده واحد اندازه گیری</h1>
        </div>
    </div>
</body>

</html>
