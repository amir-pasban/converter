<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <!-- link font awesome -->
    <link rel="stylesheet" href="/src/css/all.css">
    <!-- link constant -->
    <link rel="stylesheet" href="/src/css/constants.css">
    <!-- link of the style.css -->
    <link rel="stylesheet" href="/src/css/style.css">

</head>


<body>


    <!-- container asidebar -->

    <div class="container-asidebar-site">

        <!-- header or top asidebar -->
        <div class="header-asidebar">

            <!-- title asidebar -->
            <div class="title-asidebar">
                <p>واحد ها</p>
            </div>
            <!-- choose money or measurment -->
            <div class="button-money-measurment">
                <button type="button">اندازه گیری</button>
                <button type="button">پول</button>
            </div>

        </div>

        <!-- separator line -->
        <div class="separator-line line"></div>

        <!-- container suggestions -->
        <div class="container-suggestions">

            <!-- title suggestion -->
            <div class="title-suggestions">
                <p>پیشنهادات</p>
            </div>

            <!-- suggestions  -->
            <div class="suggestion-asidebar">
                <!-- suggestion-1 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(<i class="fas fa-dollar-sign"></i>)</p>
                            <p>دلار</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>یورو</p>
                            <p>(<i class="fas fa-euro-sign"></i>)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-2 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(<i class="fas fa-pound-sign"></i>)</p>
                            <p>پوند</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>لیر</p>
                            <p>(<i class="fas fa-turkish-lira"></i>)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-3 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(m)</p>
                            <p>متر</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>اینچ</p>
                            <p>(in)</p>
                        </div>

                    </button>
                </div>

                <!-- suggestion-4 -->
                <div class="suggestion-convrsion">
                    <button type="button">

                        <div class="names-money">
                            <p>(m)</p>
                            <p>متر</p>
                        </div>

                        <div class="container-icon-exchange">
                            <i class="fas fa-exchange"></i>
                        </div>

                        <div class="names-money">
                            <p>کیلومتر</p>
                            <p>(km)</p>
                        </div>

                    </button>
                </div>

            </div>
        </div>

        <!-- separator line -->
        <div class="separator-line"></div>


        <div class="container-prices">

            <div class="title-prices">
                <p>ارز های دیجیتال<span>(بروز)</span></p>
            </div>

            <div class="prices">
                <div class="prices-item"><a href="#">بیت کوین(BTC)<span><i class="fas fa-angle-left"></i></span></a></div>
                <div class="prices-item"><a href="#">انس طلا(PAXG)<span><i class="fas fa-angle-left"></i></span></a></div>
                <div class="prices-item"><a href="#">اتریوم(ETH)<span><i class="fas fa-angle-left"></i></span></a></div>
                <div class="prices-item"><a href="#">تتر(USDT)<span><i class="fas fa-angle-left"></i></span></a></div>
            </div>


        </div>

    </div>

    <!-- container-site -->
    <div class="container-converter-right">
        <h1>سلام</h1>
    </div>
</body>

</html>
