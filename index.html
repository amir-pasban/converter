<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <!-- link font awesome -->
    <link rel="stylesheet" href="/src/css/all.css">
    <!-- link constant -->
    <link rel="stylesheet" href="/src/css/constants.css">
    <!-- link of the style.css -->
    <link rel="stylesheet" href="/src/css/style.css">

</head>


<body>
    <!-- container-site -->
    <div class="container">

        <!-- container asidebar -->

        <div class="container-asidebar-site">

            <!-- container icon bar -->
            <ul class="container-i-bar">

                <!-- icon bar -->
                <!-- asidebar -->
                <li class="menu-asidebar"><a href="#"><i class="fas fa-bars"></i></a>
                    <ul>
                        <li>
                            <div class="asidebar">

                                <!-- header or top asidebar -->
                                <div class="header-asidebar">

                                    <!-- title asidebar -->
                                    <div class="title-asidebar">
                                        <p>واحد ها</p>
                                    </div>
                                    <!-- choose money or measurment -->
                                    <div class="button-money-measurment">
                                        <button type="button">اندازه گیری</button>
                                        <button type="button">پول</button>
                                    </div>

                                </div>

                                <!-- separator line -->
                                <div class="separator-line line"></div>

                                <!-- container suggestions -->
                                <div class="container-suggestions">

                                    <!-- title suggestion -->
                                    <div class="title-suggestions">
                                        <p>پیشنهادات</p>
                                    </div>

                                    <!-- suggestions  -->
                                    <div class="suggestion-asidebar">
                                        <!-- suggestion-1 -->
                                        <div class="suggestion-convrsion">
                                            <button type="button">

                                                <div class="names-money">
                                                    <p>(<i class="fas fa-dollar-sign"></i>)</p>
                                                    <p>دلار</p>
                                                </div>

                                                <div class="container-icon-exchange">
                                                    <i class="fas fa-exchange"></i>
                                                </div>

                                                <div class="names-money">
                                                    <p>یورو</p>
                                                    <p>(<i class="fas fa-euro-sign"></i>)</p>
                                                </div>

                                            </button>
                                        </div>

                                        <!-- suggestion-2 -->
                                        <div class="suggestion-convrsion">
                                            <button type="button">

                                                <div class="names-money">
                                                    <p>(<i class="fas fa-pound-sign"></i>)</p>
                                                    <p>پوند</p>
                                                </div>

                                                <div class="container-icon-exchange">
                                                    <i class="fas fa-exchange"></i>
                                                </div>

                                                <div class="names-money">
                                                    <p>لیر</p>
                                                    <p>(<i class="fas fa-turkish-lira"></i>)</p>
                                                </div>

                                            </button>
                                        </div>

                                        <!-- suggestion-3 -->
                                        <div class="suggestion-convrsion">
                                            <button type="button">

                                                <div class="names-money">
                                                    <p>(m)</p>
                                                    <p>متر</p>
                                                </div>

                                                <div class="container-icon-exchange">
                                                    <i class="fas fa-exchange"></i>
                                                </div>

                                                <div class="names-money">
                                                    <p>اینچ</p>
                                                    <p>(in)</p>
                                                </div>

                                            </button>
                                        </div>

                                        <!-- suggestion-4 -->
                                        <div class="suggestion-convrsion">
                                            <button type="button">

                                                <div class="names-money">
                                                    <p>(m)</p>
                                                    <p>متر</p>
                                                </div>

                                                <div class="container-icon-exchange">
                                                    <i class="fas fa-exchange"></i>
                                                </div>

                                                <div class="names-money">
                                                    <p>کیلومتر</p>
                                                    <p>(km)</p>
                                                </div>

                                            </button>
                                        </div>

                                    </div>
                                </div>

                                <!-- separator line -->
                                <div class="separator-line"></div>


                                <div class="container-prices">

                                    <div class="title-prices">
                                        <p>ارز های دیجیتال</p>
                                    </div>

                                    <div class="prices">
                                        <div class="prices-item"><a href="#">بیت کوین(BTC)<span><i
                                                        class="fas fa-angle-left"></i></span></a>
                                        </div>
                                        <div class="prices-item"><a href="#">انس طلا(PAXG)<span><i
                                                        class="fas fa-angle-left"></i></span></a>
                                        </div>
                                        <div class="prices-item"><a href="#">اتریوم(ETH)<span><i
                                                        class="fas fa-angle-left"></i></span></a>
                                        </div>
                                        <div class="prices-item"><a href="#">تتر(USDT)<span><i
                                                        class="fas fa-angle-left"></i></span></a>
                                        </div>
                                    </div>


                                </div>
                            </div>
                        </li>
                    </ul>
                </li>
                <!-- setting site -->
                <li class="parent-setting"><a href="#"><i class="fas fa-cog"></i></a>
                    <ul>
                        <li>
                            <!-- setting -->
                            <div class="setting">
                                <!-- title setting -->
                                <div class="title-setting">
                                    <p>تنظیمات</p>
                                </div>
                                <!-- item setting -->
                                <div class="container-items-setting">
                                    <!--  -->
                                    <div class="item-setting-1">
                                        <ul class="container-menu-setting">
                                            <li class="menu-drupdown-setting">
                                                <p>زبان<span>(فارسی)</span></p>
                                            </li>
                                            <li class="icon-left-setting">
                                                <i class="fas fa-angle-left"></i>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="item-setting-1">
                                        <ul class="container-menu-setting">
                                            <li class="menu-drupdown-setting">
                                                <p>تم سایت<span>(روشن)</span></p>
                                            </li>
                                            <li class="icon-left-setting">
                                                <i class="fas fa-angle-left"></i>
                                            </li>
                                        </ul>
                                    </div>

                                    <div class="item-setting-2">
                                        <a href="#">سوالات متداول</a>
                                    </div>
                                    <div class="item-setting-2">
                                        <a href="#">تماس با ما</a>
                                    </div>
                                    <div class="item-setting-2">
                                        <a href="#">گزارش باگ</a>
                                    </div>
                                </div>

                            </div>
                        </li>
                    </ul>
                </li>

            </ul>

            <!-- asidebar -->


        </div>

        <!-- container-main site -->
        <div class="container-main-site">
            <!-- main-site -->
            <div class="main-site">

                <!-- title main site -->
                <div class="title-ms-measurement">
                    <h2>اندازه گیری</h2>
                </div>

                <!-- container  -->

            </div>

        </div>



    </div>



</body>

</html>
